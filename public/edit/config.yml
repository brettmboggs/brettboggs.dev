# ------------------------------------------------------------------
# Editor (Sveltia CMS) at /edit/. Docs: https://github.com/sveltia/sveltia-cms
#
# Every save is a commit to main, and the deploy workflow publishes it in about
# a minute. Only GitHub accounts with write access to the repo can save, which
# is Brett alone. Setup and sign-in: docs/EDITOR.md.
#
# Page copy lives in src/data/copy/<page>.json, one file per page, and each
# page template reads its file. A new page gets a JSON file, a template that
# reads it, and an entry below.
# ------------------------------------------------------------------
backend:
  name: github
  repo: brettmboggs/brettboggs.dev
  branch: main
  # "Sign in with GitHub" goes through this Worker (tools/edit-auth, personal
  # Cloudflare account). It holds the client id and secret; nothing sensitive
  # lives in this repo.
  base_url: https://brettboggs-edit-auth.brettmboggs.workers.dev
  commit_messages:
    create: "Add {{collection}} {{slug}}"
    update: "Edit {{collection}} {{slug}}"
    delete: "Remove {{collection}} {{slug}}"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

site_url: https://brettboggs.dev
display_url: https://brettboggs.dev
logo_url: /favicon.svg

media_folder: public/uploads
public_folder: /uploads

media_libraries:
  default:
    config:
      max_file_size: 20000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400

slug:
  encoding: ascii
  clean_accents: true

collections:
  # ---------------------------------------------------------------- Work
  - name: work
    label: Work entries
    label_singular: Work entry
    description: The rows on /work and its indexes. Bespoke pages (Datum, the photo sets, the websites) take their words from Work pages; this sets the title, description and dates they are listed under.
    folder: src/content/work
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}{{draft | ternary(' · draft', '')}}"
    sortable_fields: [date, title]
    preview_path: /work/{{slug}}/
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: date, label: Date, widget: datetime, time_format: false, format: YYYY-MM-DD }
      - { name: dateEnd, label: End date (for a span), widget: datetime, time_format: false, format: YYYY-MM-DD, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: Draft (hidden everywhere), widget: boolean, default: false }
      - name: group
        label: Filed under
        widget: select
        required: false
        options: [photography, websites]
      - name: alsoIn
        label: Also listed in
        widget: select
        multiple: true
        required: false
        options: [photography, websites]
      - { name: bespoke, label: Has a hand-built page, widget: boolean, default: false, hint: Leave as it is. On means the page is not built from the body below. }
      - { name: unlisted, label: Unlisted (page exists, off the index), widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown, required: false }

