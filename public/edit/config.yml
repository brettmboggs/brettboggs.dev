  # ---------------------------------------------------------------- Resume
  - name: resume
    label: Resume
    description: The resume at /resume/ and the machine-readable /resume.json are the same file. Keep it factual.
    files:
      - name: resume
        label: Resume
        file: public/resume.json
        preview_path: /resume/
        fields:
          - { name: $schema, label: Schema, widget: string, readonly: true }
          - name: basics
            label: Basics
            widget: object
            fields:
              - { name: name, label: Name, widget: string }
              - { name: label, label: Title line, widget: string }
              - { name: email, label: Email, widget: string }
              - { name: url, label: Website, widget: string }
              - { name: summary, label: Summary, widget: text }
              - name: location
                label: Location
                widget: object
                fields:
                  - { name: city, label: City, widget: string }
                  - { name: region, label: Region, widget: string }
                  - { name: countryCode, label: Country code, widget: string }
              - name: profiles
                label: Profiles
                widget: list
                summary: "{{network}}"
                fields:
                  - { name: network, label: Network, widget: string }
                  - { name: username, label: Username, widget: string }
                  - { name: url, label: Link, widget: string }
          - name: work
            label: Work history
            widget: list
            summary: "{{position}} · {{name}}"
            fields:
              - { name: name, label: Organisation, widget: string }
              - { name: position, label: Position, widget: string }
              - { name: url, label: Link, widget: string, required: false }
              - { name: startDate, label: Start (YYYY-MM), widget: string }
              - { name: endDate, label: End (YYYY-MM, blank for now), widget: string, required: false }
              - { name: summary, label: Summary, widget: text }
              - { name: highlights, label: Highlights, widget: list, required: false }
          - name: projects
            label: Projects
            widget: list
            summary: "{{name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: url, label: Link, widget: string, required: false }
              - { name: entity, label: Organisation (shown when there is no link), widget: string, required: false }
          - name: skills
            label: Skills
            widget: list
            summary: "{{name}}"
            fields:
              - { name: name, label: Group, widget: string }
              - { name: keywords, label: Skills, widget: list }
          - name: education
            label: Education
            widget: list
            summary: "{{studyType}}, {{institution}}"
            fields:
              - { name: institution, label: Institution, widget: string }
              - { name: area, label: Area, widget: string }
              - { name: studyType, label: Degree, widget: string }
          - name: meta
            label: Meta
            widget: object
            fields:
              - { name: canonical, label: Canonical URL, widget: string, readonly: true }
              - { name: lastModified, label: Last updated (YYYY-MM-DD), widget: string }
