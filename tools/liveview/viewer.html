<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live View</title>
<style>
  :root {
    --bg: #121212;          /* neutral gray so the surround doesn't bias your color judgement */
    --panel: rgba(28, 28, 28, 0.88);
    --line: rgba(255, 255, 255, 0.12);
    --text: #e6e6e6;
    --dim: #8c8c8c;
    --accent: #d9971e;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  body.idle { cursor: none; }

  #stage { position: absolute; inset: 0; display: grid; place-items: center; }
  #frame { position: relative; }
  #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #frame.mirror .flip { transform: scaleX(-1); }
  #frame.rotate { transform: rotate(180deg); }

  .hud { position: absolute; transition: opacity .4s cubic-bezier(.22,1,.36,1); }
  body.idle .hud, body.clean .hud { opacity: 0; pointer-events: none; }
  body.clean #hist { opacity: 1; }
  body.clean.nohist #hist { opacity: 0; }

  #status { top: 12px; left: 12px; font: 11px/1.5 var(--mono); color: var(--dim);
    background: var(--panel); padding: 6px 10px; border-radius: 6px; }
  #status b { color: var(--text); font-weight: 500; }
  #status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #666; margin-right: 6px; vertical-align: 1px; }
  #status .dot.live { background: #5fb760; }
  #side { position: absolute; top: 12px; right: 12px; width: 258px; display: flex; flex-direction: column; gap: 8px;
    max-height: calc(100vh - 110px); overflow-y: auto; scrollbar-width: none; }
  #side > .hud, #side > .panel { position: static; }
  #hist { width: 258px; height: 100px; background: rgba(0,0,0,.55); border-radius: 6px; border: 1px solid var(--line); flex: none; }
  .panel { background: var(--panel); border: 1px solid var(--line); padding: 10px; border-radius: 10px; backdrop-filter: blur(8px);
    display: flex; flex-direction: column; gap: 8px; }
  #assist[hidden], .panel [hidden] { display: none !important; }
  body.clean #assist { display: none; }
  .arow { display: flex; align-items: center; gap: 8px; min-height: 26px; }
  .arow .label { width: 64px; flex: none; }
  #exText { flex: 1; font: 12px/1.3 var(--mono); }
  #exText.good { color: #7fc77f; }
  #exText.warn { color: #f0b04a; }
  .meter { flex: 1; height: 10px; background: rgba(255,255,255,.08); border-radius: 5px; position: relative; overflow: hidden; }
  .meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: #7fc77f; border-radius: 5px; transition: width .12s linear; }
  .meter i.mid { background: #f0b04a; } .meter i.low { background: #d9634a; }
  .hint { font-size: 11px; color: var(--dim); }
  #count { position: absolute; inset: 0; display: grid; place-items: center; font: 600 22vh/1 -apple-system, system-ui, sans-serif;
    color: rgba(255,255,255,.9); text-shadow: 0 4px 30px rgba(0,0,0,.6); pointer-events: none; }
  #count[hidden] { display: none; }
  #frame { cursor: crosshair; }
  #ghost { opacity: .35; }
  #cam input[type=number] { width: 70px; font: inherit; color: var(--text); background: rgba(255,255,255,.06);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  #shoot.stop { background: #d9634a; border-color: #d9634a; color: #fff; }
  #quit[hidden] { display: none; }

  #bar { left: 12px; right: 12px; bottom: 14px; margin: 0 auto; width: fit-content; display: flex; flex-wrap: wrap; gap: 6px;
    align-items: center; justify-content: center;
    background: var(--panel); border: 1px solid var(--line); padding: 8px; border-radius: 10px; backdrop-filter: blur(8px); }
  .group { display: flex; gap: 4px; align-items: center; padding: 0 6px; border-right: 1px solid var(--line); }
  .group:last-child { border-right: 0; }
  .label { font: 10px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; }
  button, select { font: inherit; color: var(--text); background: rgba(255,255,255,.06); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  select { max-width: 220px; }
  button:hover, select:hover { background: rgba(255,255,255,.12); }
  button.on { background: var(--accent); color: #1a1408; border-color: var(--accent); }
  button kbd { font: 10px var(--mono); opacity: .55; margin-left: 4px; }
  input[type=range] { width: 70px; accent-color: var(--accent); }

  #empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--dim); }
  #empty h1 { font-weight: 500; font-size: 18px; color: var(--text); margin: 0 0 8px; }
  #empty p { margin: 4px 0; max-width: 520px; }
  #empty code { font-family: var(--mono); color: var(--text); }
  #cam[hidden] { display: none; }
  #cam .camrow { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  #cam .camrow select { width: 128px; }
  #cam .focus { justify-content: stretch; }
  #cam .focus button { flex: 1; padding: 5px 0; }
  #shoot { padding: 12px; font-weight: 600; background: #f2f2f2; color: #111; border-color: #f2f2f2; }
  #shoot:hover { background: #fff; }
  #shoot:disabled { opacity: .5; cursor: wait; }
  #expo { color: var(--text); margin-left: 8px; }
  #toast { left: 50%; top: 52px; transform: translateX(-50%); background: var(--panel); padding: 6px 12px;
    border-radius: 6px; opacity: 0; pointer-events: none; }
  #toast.show { opacity: 1 !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="video" class="flip"></canvas>
    <canvas id="ghost" class="flip" hidden></canvas>
    <canvas id="mask" class="flip"></canvas>
    <canvas id="guides"></canvas>
  </div>
</div>

<div id="empty">
  <div>
    <h1>No camera yet</h1>
    <p id="emptyMsg">Pick a source below.</p>
  </div>
</div>

<div id="status" class="hud"><span class="dot" id="dot"></span><b id="srcName">No source</b> <span id="meta"></span><span id="expo"></span></div>
<div id="count" hidden></div>
<div id="toast" class="hud"></div>

<div id="side">
<canvas id="hist" class="hud" width="256" height="100"></canvas>

<div id="assist" class="panel">
  <div class="arow"><span class="label">Exposure</span><span id="exText">…</span><button id="exFix" hidden title="Apply the suggested exposure">Fix</button></div>
  <div class="arow"><span class="label">Focus</span><div class="meter" title="Sharpness in the focus box. Highest is sharpest."><i id="fBar"></i></div></div>
  <div class="hint">Click the picture to pick what to focus on. Double-click to focus there.</div>
  <button id="pfBtn" hidden title="Fine-tune focus on the box by measuring sharpness">Precision focus<kbd>D</kbd></button>
</div>

<div id="cam" class="hud panel" hidden>
  <div class="camrow"><span class="label">Mode</span><select id="mode">
    <option value="single">Single</option>
    <option value="timer">Self-timer</option>
    <option value="bracket">Bracket (HDR)</option>
    <option value="stack">Focus stack</option>
    <option value="lapse">Time-lapse</option>
  </select></div>
  <div class="camrow" data-for="timer"><span class="label">Delay</span><select id="timerSec"><option value="2">2 s</option><option value="5">5 s</option><option value="10">10 s</option></select></div>
  <div class="camrow" data-for="bracket"><span class="label">Shots</span><select id="brCount"><option value="3">3</option><option value="5">5</option></select></div>
  <div class="camrow" data-for="bracket"><span class="label">Spacing</span><select id="brStep"><option value="0.67">⅔ EV</option><option value="1">1 EV</option><option value="2">2 EV</option></select></div>
  <div class="camrow" data-for="stack"><span class="label">Shots</span><input id="stCount" type="number" min="2" max="300"></div>
  <div class="camrow" data-for="stack"><span class="label">Step</span><select id="stStep"><option value="1">Fine</option><option value="2">Medium</option><option value="3">Coarse</option></select></div>
  <div class="camrow" data-for="stack"><span class="label">Go toward</span><select id="stDir"><option value="1">Far</option><option value="-1">Near</option></select></div>
  <div class="camrow" data-for="lapse"><span class="label">Every (s)</span><input id="lpEvery" type="number" min="1" max="3600"></div>
  <div class="camrow" data-for="lapse"><span class="label">Shots</span><input id="lpCount" type="number" min="1" max="9999"></div>
  <button id="shoot" title="Take a picture"><span id="shootLabel">Shoot</span><kbd>Space</kbd></button>
  <div id="camSettings"></div>
  <span class="label">Focus · near / far</span>
  <div class="camrow focus">
    <button data-mf="-3" title="Near, big step ( { )">‹‹‹</button><button data-mf="-2" title="Near">‹‹</button><button data-mf="-1" title="Near, fine ( [ )">‹</button>
    <button data-mf="1" title="Far, fine ( ] )">›</button><button data-mf="2" title="Far">››</button><button data-mf="3" title="Far, big step ( } )">›››</button>
  </div>
  <button id="afBtn" title="Autofocus">Autofocus<kbd>A</kbd></button>
  <label class="camrow"><span class="label">Copy shots to laptop</span><input type="checkbox" id="dl"></label>
  <label class="camrow"><span class="label">Ghost of last shot</span><input type="checkbox" id="ghostOn"></label>
</div>
</div>

<div id="bar" class="hud">
  <div class="group">
    <span class="label">Source</span>
    <select id="source"></select>
    <button id="refresh" title="Rescan devices">↻</button>
  </div>
  <div class="group">
    <span class="label">Grid</span>
    <select id="grid">
      <option value="off" selected>Off</option>
      <option value="thirds">Thirds</option>
      <option value="thirds+">Thirds + center</option>
      <option value="quarters">4 × 4</option>
    </select>
    <select id="aspect" title="Crop guide">
      <option value="off">No crop guide</option>
      <option value="1.5">3:2</option>
      <option value="1.7778">16:9</option>
      <option value="2.39">2.39:1</option>
      <option value="1">1:1</option>
      <option value="0.8">4:5</option>
      <option value="0.5625">9:16</option>
    </select>
  </div>
  <div class="group">
    <button id="peak" title="Focus peaking">Peaking<kbd>P</kbd></button>
    <input id="peakLevel" type="range" min="1" max="10" value="5" title="Peaking sensitivity">
    <select id="peakColor" title="Peaking color">
      <option value="255,60,40">Red</option>
      <option value="255,220,40">Yellow</option>
      <option value="60,200,255">Cyan</option>
      <option value="255,255,255">White</option>
    </select>
  </div>
  <div class="group">
    <button id="zebra" title="Zebra stripes on bright areas">Zebras<kbd>Z</kbd></button>
    <select id="zebraLevel" title="Zebra threshold">
      <option value="0.90">90%</option>
      <option value="0.95" selected>95%</option>
      <option value="0.99">100%</option>
    </select>
  </div>
  <div class="group">
    <button id="assistBtn" class="on" title="Exposure and focus assist">Assist<kbd>I</kbd></button>
    <button id="histBtn" class="on" title="Histogram">Histogram<kbd>H</kbd></button>
    <button id="mirror" title="Mirror horizontally">Mirror<kbd>M</kbd></button>
    <button id="rotate" title="Rotate 180°">Flip<kbd>R</kbd></button>
  </div>
  <div class="group">
    <button id="snap" title="Save the current frame as PNG">Snapshot<kbd>S</kbd></button>
    <button id="clean" title="Hide all controls">Clean<kbd>C</kbd></button>
    <button id="full" title="Fullscreen">Full<kbd>F</kbd></button>
    <button id="quit" hidden title="Give the camera back and close">Quit</button>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const frameEl = $('frame'), videoCv = $('video'), maskCv = $('mask'), guideCv = $('guides'), histCv = $('hist');
  const vctx = videoCv.getContext('2d'), mctx = maskCv.getContext('2d'), gctx = guideCv.getContext('2d'), hctx = histCv.getContext('2d');
  const work = document.createElement('canvas'), wctx = work.getContext('2d', { willReadFrequently: true });

  // ---- persisted settings ----------------------------------------------------
  const KEY = 'liveview.settings';
  const S = Object.assign({ source: '', grid: 'off', aspect: 'off', peak: false, peakLevel: 5,
    peakColor: '255,60,40', zebra: false, zebraLevel: '0.95', hist: true, mirror: false, rotate: false,
    assist: true, mode: 'single', timerSec: '5', brCount: '3', brStep: '1', stCount: 10, stStep: '2', stDir: '1',
    lpEvery: 5, lpCount: 100, download: false, ghost: false },
    (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })());
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

  // ---- sources -----------------------------------------------------------------
  const video = document.createElement('video');
  video.muted = true; video.playsInline = true;
  let stream = null, bitmap = null, frameW = 0, frameH = 0, frameSeq = 0, srcToken = 0;
  let hasBridge = false, quitting = false;
  const fpsTimes = [];

  async function detectBridge() {
    if (!/^https?:$/.test(location.protocol)) return false;
    try { const r = await fetch('/status', { cache: 'no-store' }); return (await r.json()).bridge === true; }
    catch { return false; }
  }

  async function listSources() {
    const sel = $('source');
    const opts = [];
    if (hasBridge) opts.push({ value: 'bridge', label: 'Canon over USB (gphoto2)' });
    if (navigator.mediaDevices?.enumerateDevices) {
      const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      devices.forEach((d, i) => opts.push({ value: 'dev:' + d.deviceId, label: d.label || `Camera ${i + 1}` }));
      if (devices.length && !devices[0].label) opts.push({ value: 'ask', label: 'Allow camera access…' });
    }
    sel.innerHTML = '<option value="">Choose source…</option>' +
      opts.map(o => `<option value="${o.value}">${o.label.replace(/</g, '&lt;')}</option>`).join('');
    return opts;
  }

  // Prefer whatever the user last picked, then anything that looks like the camera.
  function pickDefault(opts) {
    if (opts.some(o => o.value === S.source)) return S.source;
    const canon = opts.find(o => /canon|eos|webcam utility|hdmi|capture|cam link|usb video/i.test(o.label) && o.value !== 'ask');
    if (canon) return canon.value;
    if (hasBridge) return 'bridge';
    return '';
  }

  function stopSource() {
    srcToken++;
    $('cam').hidden = true; $('pfBtn').hidden = true; $('exFix').hidden = true; $('expo').textContent = '';
    control = false; if (running) running.cancel = true;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    if (bitmap) { bitmap.close?.(); bitmap = null; }
    frameW = frameH = 0;
  }

  async function useSource(value) {
    stopSource();
    $('source').value = value;
    S.source = value === 'ask' ? '' : value; save();
    const token = srcToken;
    if (!value) return showEmpty('Pick a source below.');
    if (value === 'ask') {
      try { const s = await navigator.mediaDevices.getUserMedia({ video: true }); s.getTracks().forEach(t => t.stop()); }
      catch (e) { return showEmpty('Camera access was blocked. Allow it in the browser’s site settings, then press ↻.'); }
      const opts = await listSources();
      return useSource(pickDefault(opts));
    }
    if (value === 'bridge') {
      $('srcName').textContent = 'Canon over USB';
      showEmpty('Waiting for the camera…');
      bridgeLoop(token);
      startControls(token);
      return;
    }
    const deviceId = value.slice(4);
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: {
        deviceId: { exact: deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } } });
    } catch (e) {
      return showEmpty(`Couldn’t open that camera (${e.name}). It may be in use by another app.`);
    }
    if (token !== srcToken) { stream.getTracks().forEach(t => t.stop()); return; }
    video.srcObject = stream;
    await video.play().catch(() => {});
    $('srcName').textContent = stream.getVideoTracks()[0].label || 'Camera';
    const vfc = () => { if (token !== srcToken) return; frameSeq++; tickFps(); video.requestVideoFrameCallback(vfc); };
    if ('requestVideoFrameCallback' in video) video.requestVideoFrameCallback(vfc);
  }

  async function bridgeLoop(token) {
    let after = 0, lastStatus = 0;
    while (token === srcToken) {
      try {
        const r = await fetch(`/next.jpg?after=${after}`, { cache: 'no-store' });
        if (token !== srcToken) return;
        if (r.status === 200) {
          after = +r.headers.get('X-Seq') || after + 1;
          const bmp = await createImageBitmap(await r.blob());
          if (token !== srcToken) { bmp.close?.(); return; }
          bitmap?.close?.(); bitmap = bmp; frameSeq++; tickFps();
          continue;
        }
        if (performance.now() - lastStatus > 2000) {
          lastStatus = performance.now();
          const st = await (await fetch('/status', { cache: 'no-store' })).json();
          showEmpty('Waiting for the camera…<br><small>' + (st.log.slice(-1)[0] || st.state).replace(/</g, '&lt;') + '</small>');
        }
      } catch {
        showEmpty('Lost the bridge. Is <code>bridge.py</code> still running?');
        await new Promise(r => setTimeout(r, 1000));
      }
    }
  }

  // ---- camera controls (bridge with the gphoto2 Python package) --------------------
  const SHOW = ['shutterspeed', 'aperture', 'iso', 'exposurecompensation', 'whitebalance', 'drivemode', 'focusmode', 'imageformat'];
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  let control = false;

  async function startControls(token) {
    try { control = !!(await (await fetch('/status', { cache: 'no-store' })).json()).control; } catch { control = false; }
    if (token !== srcToken) return;
    $('cam').hidden = !control;
    $('pfBtn').hidden = !control;
    if (control) cmd({ cmd: 'download', on: S.download });
    while (control && token === srcToken) {
      try { renderSettings((await (await fetch('/settings', { cache: 'no-store' })).json()).settings || {}); } catch {}
      await new Promise(r => setTimeout(r, 1500));
    }
  }

  function renderSettings(s) {
    camSettings = s;
    const v = (k) => s[k]?.value;
    const parts = [];
    if (v('shutterspeed')) parts.push(v('shutterspeed'));
    if (v('aperture')) parts.push('f/' + v('aperture').replace(/^f\//, ''));
    if (v('iso')) parts.push('ISO ' + v('iso'));
    if (v('exposurecompensation') && v('exposurecompensation') !== '0') parts.push(v('exposurecompensation') + ' EV');
    if (v('availableshots')) parts.push(v('availableshots') + ' shots left');
    if (v('batterylevel')) parts.push('battery ' + v('batterylevel'));
    $('expo').textContent = parts.length ? '· ' + parts.join(' · ') : '';
    const box = $('camSettings');
    for (const name of SHOW) {
      const e = s[name];
      if (!e || !e.choices || !e.choices.length) continue;
      let row = box.querySelector(`[data-name="${name}"]`);
      if (!row) {
        row = document.createElement('div'); row.className = 'camrow'; row.dataset.name = name;
        row.innerHTML = `<span class="label">${esc(e.label)}</span><select></select>`;
        const sel = row.querySelector('select');
        sel.onchange = () => cmd({ cmd: 'set', name, value: sel.value });
        box.appendChild(row);
      }
      const sel = row.querySelector('select');
      if (document.activeElement === sel) continue;
      const choices = e.choices.includes(e.value) ? e.choices : [e.value, ...e.choices];
      const key = choices.join('\n');
      if (sel.dataset.key !== key) { sel.innerHTML = choices.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join(''); sel.dataset.key = key; }
      sel.value = e.value; sel.disabled = e.readonly;
    }
  }

  async function cmd(body) {
    try {
      const r = await fetch('/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const j = await r.json();
      if (!j.ok) toast(j.error || 'The camera said no');
      if (j.settings) renderSettings(j.settings);
      return j;
    } catch { toast('Can’t reach bridge.py'); return { ok: false }; }
  }

  // ---- shooting modes ------------------------------------------------------------
  let camSettings = {}, running = null;
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  async function wait(job, ms) { const end = performance.now() + ms; while (!job.cancel && performance.now() < end) await sleep(Math.min(100, end - performance.now())); }

  async function shoot() {
    if (!control) return;
    if (running) { running.cancel = true; toast('Stopping…'); return; }
    const job = running = { cancel: false };
    $('shoot').classList.add('stop'); $('shootLabel').textContent = 'Stop';
    try { await (MODES[S.mode] || MODES.single)(job); }
    catch (e) { toast(String(e.message || e)); }
    finally {
      running = null; $('count').hidden = true;
      $('shoot').classList.remove('stop'); $('shootLabel').textContent = 'Shoot';
    }
  }

  // One exposure. Keeps the frame just before it for the ghost overlay.
  async function one(job, label) {
    if (job.cancel) return null;
    const src = stream ? video : bitmap;
    if (src && frameW) { try { ghostBmp?.close?.(); ghostBmp = await createImageBitmap(src); ghostDirty = true; } catch {} }
    toast(label || 'Shooting…');
    const j = await cmd({ cmd: 'shoot' });
    if (!j.ok) throw new Error(j.error || 'Shot failed');
    if (!label) toast(j.saved ? `${j.file} saved to card and laptop` : `${j.file} saved to card`);
    return j;
  }

  let audio;
  function beep(freq, ms) {
    try {
      audio = audio || new AudioContext();
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; g.gain.value = 0.08; o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + ms / 1000);
    } catch {}
  }

  // Numeric value of a setting choice ("1/250" -> 0.004, "+1.3" -> 1.3, "ISO 400" -> 400).
  function num(c) {
    const m = String(c).match(/(-?\d+(?:\.\d+)?)(?:\s*\/\s*(\d+(?:\.\d+)?))?/);
    if (!m) return NaN;
    return m[2] ? parseFloat(m[1]) / parseFloat(m[2]) : parseFloat(m[1]);
  }
  // For shutter speed, exposure compensation and ISO, a bigger number is a brighter picture,
  // and Canon steps them in thirds. So "brighter by n thirds" is "n places up the sorted list".
  function stepped(name, thirds, from) {
    const e = camSettings[name];
    if (!e?.choices) return null;
    const list = e.choices.filter(c => !isNaN(num(c))).sort((a, b) => num(a) - num(b));
    const cur = from ?? e.value;

    const x = c.getContext('2d');
    if (S.rotate) { x.translate(frameW, frameH); x.rotate(Math.PI); }
    if (S.mirror) { x.translate(frameW, 0); x.scale(-1, 1); }
    x.drawImage(src, 0, 0);
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    const name = `liveview-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.png`;
    c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Saved ' + name); });
  }

  let toastT;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

  addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    const map = { p: 'peak', z: 'zebra', h: 'histBtn', m: 'mirror', r: 'rotate', s: 'snap', c: 'clean', f: 'full', i: 'assistBtn' };
    if (map[k]) { $(map[k]).click(); e.preventDefault(); }
    if (k === 'g') { const o = ['off', 'thirds', 'thirds+', 'quarters']; S.grid = o[(o.indexOf(S.grid) + 1) % o.length]; applyUI(); }
    if (k === 'escape') { document.body.classList.remove('clean'); if (running) { running.cancel = true; toast('Stopping…'); } }
    if (control) {
      if (e.key === ' ') { e.preventDefault(); if (!e.repeat) shoot(); }
      if (k === 'a' && !e.repeat) $('afBtn').click();
      if (k === 'd' && !e.repeat) precisionFocus();
      const mf = { '[': -1, ']': 1, '{': -3, '}': 3 }[e.key];
      if (mf) cmd({ cmd: 'mf', step: mf });
    }
  });

  // Hide controls and cursor after a moment of stillness.
  let idleT;
  const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!$('bar').matches(':hover') && !$('side').matches(':hover')) document.body.classList.add('idle'); }, 2500); };
  addEventListener('mousemove', wake); addEventListener('keydown', wake); wake();
  addEventListener('resize', () => { lastLayout = ''; });
  navigator.mediaDevices?.addEventListener?.('devicechange', () => listSources().then(() => $('source').value = S.source));

  // ---- start ---------------------------------------------------------------------
  (async () => {
    applyUI();
    hasBridge = await detectBridge();
    if (hasBridge) {
      // The Mac app quits (and releases the camera) once no viewer is left.
      $('quit').hidden = false;
      setInterval(() => { if (!quitting) fetch('/ping', { cache: 'no-store' }).catch(() => {}); }, 20000);
      addEventListener('pagehide', () => { if (!quitting) navigator.sendBeacon('/bye'); });
    }
    if (!navigator.mediaDevices?.getUserMedia && !hasBridge) {
      showEmpty('This browser can’t open cameras from here. Run <code>python3 bridge.py</code> and use the page it opens.');
    }
    const opts = await listSources();
    const first = pickDefault(opts);
    if (first) useSource(first);
    else if (opts.some(o => o.value === 'ask')) showEmpty('Choose <b>Allow camera access…</b> under Source to see your cameras.');
    else showEmpty('No cameras found. Plug the camera in, then press ↻.');
    requestAnimationFrame(render);
  })();
})();
</script>
</body>
</html>
