name: Mise build check

# Compiles the recipe app for the simulator on every push that touches it,
# on any branch. No signing, no secrets, no upload: this only answers "does
# it build". macOS runners are free on public repositories. The TestFlight
# upload lives in testflight-mise.yml and runs from main.

on:
  push:
    paths:
      - "kitchen/**"
      - ".github/workflows/mise-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mise-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pick the newest Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate and verify the project
        run: |
          set -euo pipefail
          python3 kitchen/tools/make_project.py
          python3 kitchen/tools/verify_project.py
          python3 kitchen/tools/check_swift.py

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project kitchen/Mise.xcodeproj \
            -scheme Mise \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          echo "::group::What was compiled"
          echo "app sources:       $(grep -E 'Compiling .*\.swift' "$RUNNER_TEMP/build.log" | grep -vc MiseShare || true)"
          echo "extension sources: $(grep -E 'Compiling .*\.swift' "$RUNNER_TEMP/build.log" | grep -c MiseShare || true)"
          echo "::endgroup::"
          echo "::group::Warnings"
          grep -E "warning:" "$RUNNER_TEMP/build.log" | sed 's|/Users/runner/work/brettboggs.dev/brettboggs.dev/||' | sort -u || true
          echo "::endgroup::"
          if ! grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"; then
            echo "::group::Errors"
            grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u
            echo "::endgroup::"
            exit 1
          fi

      - name: Keep the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          retention-days: 5
